            --card-background: white;

            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));

            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px var(--shadow-color);
            margin-bottom: 30px;

            margin-top: 10px;

        }

        #logout-button {

            top: 20px;
            left: 20px;
            background-color: rgba(220, 53, 69, 0.9);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        #logout-button:hover {
            background-color: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .copy-link {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0 30px;
            padding: 10px;
            gap: 15px;
        }

            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 25px;
            border: 1px solid #ddd;
            font-size: 1.1em;
            box-shadow: 0 2px 6px var(--shadow-color);
            transition: all 0.3s ease;
        }

        #search:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.3);
            border-color: var(--primary-color);
        }

            padding: 25px;
            margin-bottom: 35px;
            transition: all 0.3s ease;
        }

        .section:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px var(--shadow-color);
