<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול מערכות רישום ערלוי הכנסת אורחים</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="https://www.matara.pro/nedarimplus/Forms/Files/Pic/1395_logo.jpg">
    <style>
        /* CSS Variables */
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #50e3c2;
            --text-color: #333;
            --background-color: #f4f7f9;
            --card-background: white;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --error-color: #dc3545;
            --success-color: #28a745;
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        /* Base Styles */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Styles */
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 10px var(--shadow-color);
            margin-bottom: 30px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.5em;
            margin: 0 0 15px 0;
            font-weight: 700;
        }

        .datetime {
            font-size: 1.2em;
            margin: 10px 0 25px 0;
            opacity: 0.9;
        }

        /* Button Styles */
        .header-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: var(--transition);
            box-shadow: 0 3px 6px var(--shadow-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 120px;
        }

        .btn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 10px var(--shadow-color);
        }

        .btn-header {
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .btn-header:hover {
            background-color: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .btn-logout {
            background-color: rgba(220, 53, 69, 0.8);
            border-color: rgba(220, 53, 69, 0.9);
        }

        .btn-logout:hover {
            background-color: rgba(220, 53, 69, 0.9);
        }

        .btn-copy {
            background-color: rgba(74, 144, 226, 0.8);
            border-color: rgba(74, 144, 226, 0.9);
        }

        .btn-copy:hover {
            background-color: rgba(74, 144, 226, 0.9);
        }

        /* Search Styles */
        .search-container {
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            border: 1px solid #ddd;
            font-size: 1.1em;
            box-shadow: 0 2px 6px var(--shadow-color);
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.3);
            border-color: var(--primary-color);
        }

        /* Section Styles */
        .section {
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 8px var(--shadow-color);
            padding: 25px;
            margin-bottom: 30px;
            transition: var(--transition);
        }

        .section:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px var(--shadow-color);
        }

        .section-title {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 12px;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.6em;
            font-weight: 600;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .section-btn {
            width: 100%;
            text-align: center;
            padding: 14px 20px;
        }

        /* Login Styles */
        .login-container {
            background-color: var(--card-background);
            border-radius: var(--border-radius);
            box-shadow: 0 6px 12px var(--shadow-color);
            padding: 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        .login-title {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 1.8em;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-input {
            width: 100%;
            padding: 14px;
            border-radius: 25px;
            border: 1px solid #ddd;
            font-size: 1.05em;
            box-shadow: 0 2px 5px var(--shadow-color);
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--primary-color);
            border-color: var(--primary-color);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 25px;
            cursor: pointer;
            font-size: 1em;
        }

        .checkbox-container input[type="checkbox"] {
            width: auto;
            margin: 0 8px 0 0;
            cursor: pointer;
        }

        .error-message {
            color: var(--error-color);
            background-color: rgba(220, 53, 69, 0.1);
            padding: 12px;
            border-radius: 10px;
            font-weight: 500;
            margin-top: 15px;
            display: none;
        }

        .help-text {
            margin-top: 25px;
            font-size: 0.9em;
            color: #666;
        }

        .help-text a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .help-text a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 2em;
            }

            .header-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                width: 100%;
                max-width: 280px;
            }

            header {
                padding: 25px;
            }

            .button-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .login-container {
                padding: 25px;
            }

            .section {
                padding: 20px;
            }
        }

        /* Animation */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hidden class */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="container login-container fade-in" id="loginScreen">
        <h2 class="login-title">כניסה למערכת</h2>
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" class="form-input" placeholder="שם משתמש" autocomplete="username" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" class="form-input" placeholder="סיסמה" autocomplete="current-password" required>
            </div>
            <div class="checkbox-container">
                <label for="rememberMe">זכור אותי במחשב זה</label>
                <input type="checkbox" id="rememberMe">
            </div>
            <button type="submit" class="btn">כניסה</button>
        </form>
        <div class="error-message" id="loginError"></div>
        <p class="help-text">
            לא מצליחים להיכנס? נא לפנות ל
            <a href="mailto:h0556764462@gmail.com">h0556764462@gmail.com</a>
        </p>
    </div>

    <!-- Main Content -->
    <div class="container hidden fade-in" id="mainContent">
        <header>
            <h1>ניהול מערכת רישום נדרים פלוס</h1>
            <div class="datetime" id="datetime"></div>
            <div class="header-buttons">
                <button class="btn btn-header btn-logout" onclick="Auth.logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    יציאה
                </button>
                <button class="btn btn-header btn-copy" onclick="Utils.copyToClipboard()">
                    <i class="fas fa-copy"></i>
                    העתק לינק הכנסת אורחים
                </button>
            </div>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="חפש לפי כותרת או תיאור...">
        </div>

        <div id="sectionsContainer"></div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            USERNAME: "ערלוי",
            PASSWORD: "04880",
            CLIPBOARD_LINK: "https://www.matara.pro/nedarimplus/online/?mosad=7007229",
            REMEMBER_KEY: 'isLoggedIn'
        };

        // Data
        const SECTIONS_DATA = [
            {
                title: "ניהול כללי",
                buttons: [
                    { text: "ממשק ניהול כללי", link: "https://matara.pro/nedarimplus/Reports" },
                    { text: "זיכויים קובץ מתעדכן", link: "https://docs.google.com/spreadsheets/d/1OdE6soFMHRQZw1FrbnU5qltQAhVGQsqOfdGaN25xUMo/edit?gid=0#gid=0" },
                    { text: "ארכיון רשימות", link: "https://drive.google.com/drive/folders/1Zw0rNwtYjFd-TknTR2d5s_u4_0VWtJg8?usp=drive_link" },
                    { text: "קול כשר - מערכת טלפונית", link: "http://www.kolkasher.co.il/" },
                    { text: "תשלום חובות הכנסת אורחים", link: "https://nedar.im/Lvom" },
                    { text: "סקריפט טופס הכנסת אורחים ", link: "https://mail.google.com/mail/u/1/#inbox/KtbxLzGPrdvsSFBmxjLGlGMWRZmwhbkvjV" },
                    { text: "איימיל הכנסת אורחים - אימייל: איימיל | סיסמה: YY@048802181" },
                    { text: "וועד ימים נוראים לתרומות", link: "https://www.matara.pro/nedarimplus/online/?mosad=7015699" }
                ]
            },
            {
                title: "הכנסת אורחים",
                buttons: [
                    { text: "הפצה - הכנסת אורחים", link: "https://nedar.im/F1395" },
                    { text: "מזומן - הכנסת אורחים", link: "https://matara.pro/nedarimplus/Forms/1395.html?Mezuman=1" },
                    { text: "ניהול חדש - הכנסת אורחים", link: "https://matara.pro/nedarimplus/Forms/1395.html?ExcelJson=1" },
                    { text: "ניהול ישן - הכנסת אורחים", link: "https://matara.pro/nedarimplus/Forms/1395.html?admin=1" }
                ]
            },
            {
                title: "עונג יו''ט",
                buttons: [
                    { text: "הפצה - עונג יוט", link: "https://nedar.im/F2667" },
                    { text: "מזומן - עונג יוט", link: "https://matara.pro/nedarimplus/Forms/2667.html?m=1" },
                    { text: "ניהול - עונג יוט", link: "https://matara.pro/nedarimplus/Forms/2667.html?admin=1" }
                ]
            },
            {
                title: "הסעות",
                buttons: [
                    { text: "הפצה - הסעות", link: "https://nedar.im/F2106" },
                    { text: "מזומן - הסעות", link: "https://matara.pro/nedarimplus/Forms/2106.html?num=1" },
                    { text: "ניהול - הסעות", link: "https://matara.pro/nedarimplus/Forms/2106.html?admin=1" }
                ]
            },
            {
                title: "קימחא דפיסחא / עדכון פרטים",
                buttons: [
                    { text: "הפצה - קימחא דפיסחא / עדכון פרטים", link: "https://nedar.im/F2538" },
                    { text: "ניהול - קימחא דפיסחא / עדכון פרטים", link: "https://matara.pro/nedarimplus/Forms/2538.html?admin=1" }
                ]
            },
            {
                title: "מפי עוללים",
                buttons: [
                    { text: "הפצה - מפי עוללים", link: "https://nedar.im/F2896" },
                    { text: "מזומן - מפי עוללים", link: "https://matara.pro/nedarimplus/Forms/2896.html?num=1" },
                    { text: "ניהול - מפי עוללים", link: "https://matara.pro/nedarimplus/Forms/2896.html?admin=1" }
                ]
            },
            {
                title: "מכירת ספרים",
                buttons: [
                    { text: "הפצה - מכירת ספרים", link: "https://nedar.im/F3363" },
                    { text: "מזומן - מכירת ספרים", link: "https://matara.pro/nedarimplus/Forms/3363.html?m=1" },
                    { text: "ניהול - מכירת ספרים", link: "https://matara.pro/nedarimplus/Forms/3363.html?admin=1" }
                ]
            }
        ];

        // Authentication Module
        const Auth = {
            login(username, password, remember) {
                if (username === CONFIG.USERNAME && password === CONFIG.PASSWORD) {
                    if (remember) {
                        localStorage.setItem(CONFIG.REMEMBER_KEY, 'true');
                    }
                    App.showMainContent();
                    return true;
                }
                return false;
            },

            logout() {
                localStorage.removeItem(CONFIG.REMEMBER_KEY);
                App.showLoginScreen();
            },

            isRemembered() {
                return localStorage.getItem(CONFIG.REMEMBER_KEY) === 'true';
            }
        };

        // UI Module
        const UI = {
            showError(message) {
                const errorElement = document.getElementById('loginError');
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            },

            hideError() {
                const errorElement = document.getElementById('loginError');
                errorElement.style.display = 'none';
            },

            updateDateTime() {
                const now = new Date();
                const options = {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                };
                const datetimeElement = document.getElementById('datetime');
                if (datetimeElement) {
                    datetimeElement.textContent = now.toLocaleString('he-IL', options);
                }
            },

            renderSections(sections = SECTIONS_DATA) {
                const container = document.getElementById('sectionsContainer');
                container.innerHTML = '';

                sections.forEach(section => {
                    const sectionElement = this.createSectionElement(section);
                    container.appendChild(sectionElement);
                });
            },

            createSectionElement(section) {
                const sectionEl = document.createElement('div');
                sectionEl.className = 'section';

                const title = document.createElement('h2');
                title.className = 'section-title';
                title.textContent = section.title;
                sectionEl.appendChild(title);

                const buttonGrid = document.createElement('div');
                buttonGrid.className = 'button-grid';

                section.buttons.forEach(btn => {
                    const link = document.createElement('a');
                    link.href = btn.link;
                    link.target = "_blank";
                    link.className = 'btn section-btn';
                    link.textContent = btn.text;

                    buttonGrid.appendChild(link);
                });

                sectionEl.appendChild(buttonGrid);
                return sectionEl;
            }
        };

        // Utility Functions
        const Utils = {
            copyToClipboard() {
                navigator.clipboard.writeText(CONFIG.CLIPBOARD_LINK)
                    .then(() => {
                        alert("הלינק הועתק בהצלחה!");
                    })
                    .catch(err => {
                        console.error('שגיאה בהעתקת הטקסט:', err);
                        alert('לא הצלחנו להעתיק את הלינק. אנא נסה שוב.');
                    });
            },

            filterSections(searchTerm) {
                const term = searchTerm.toLowerCase();
                return SECTIONS_DATA.filter(section =>
                    section.title.toLowerCase().includes(term) ||
                    section.buttons.some(button => button.text.toLowerCase().includes(term))
                );
            }
        };

        // Main App Module
        const App = {
            init() {
                this.setupEventListeners();
                if (Auth.isRemembered()) {
                    this.showMainContent();
                } else {
                    this.showLoginScreen();
                }
            },

            setupEventListeners() {
                // Login form
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleLogin();
                });

                // Search functionality
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    const filteredSections = Utils.filterSections(e.target.value);
                    UI.renderSections(filteredSections);
                });

                // Enter key on password field
                document.getElementById('password').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.handleLogin();
                    }
                });
            },

            handleLogin() {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const remember = document.getElementById('rememberMe').checked;

                if (!username || !password) {
                    UI.showError('אנא מלא את כל השדות');
                    return;
                }

                if (Auth.login(username, password, remember)) {
                    UI.hideError();
                } else {
                    UI.showError('שם משתמש או סיסמה שגויים. אנא נסה שוב.');
                }
            },

            showLoginScreen() {
                document.getElementById('mainContent').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('hidden');
                this.resetLoginForm();
            },

            showMainContent() {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                
                UI.updateDateTime();
                UI.renderSections();
                
                // Update time every second
                if (this.timeInterval) clearInterval(this.timeInterval);
                this.timeInterval = setInterval(UI.updateDateTime, 1000);
            },

            resetLoginForm() {
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                document.getElementById('rememberMe').checked = false;
                UI.hideError();
            }
        };

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
